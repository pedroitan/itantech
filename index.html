<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Itan Tech — consultoria audiovisual, produção e tecnologia para eventos e plataforma de convites e confirmação de presença por WhatsApp."
    />
    <title>Itan Tech — Tecnologia para Eventos e Soluções Audiovisuais</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Formulário estático para detecção do Netlify Forms (o form real é renderizado por JS em /contato) -->
    <form name="contato" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <input type="tel" name="telefone" />
      <textarea name="mensagem"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
